apiVersion: v1
kind: Namespace
metadata:
  labels:
    control-plane: taskmole-manager
    app.kubernetes.io/name: taskmole
    app.kubernetes.io/managed-by: kustomize
  name: taskmole
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: taskmole-manager
  namespace: taskmole
  labels:
    control-plane: taskmole-manager
    app.kubernetes.io/name: taskmole
    app.kubernetes.io/managed-by: kustomize
spec:
  selector:
    matchLabels:
      control-plane: taskmole-manager
      app.kubernetes.io/name: taskmole
  replicas: 1
  template:
    metadata:
      annotations:
        kubectl.kubernetes.io/default-container: manager
      labels:
        control-plane: taskmole-manager
        app.kubernetes.io/name: taskmole
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
      - command:
        - /manager
        args:
          - --leader-elect
          - --health-probe-bind-address=:8081
          - --mcp-bind-address=:8082
        image: controller:latest
        name: manager
        env:
        - name: WATCH_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        ports:
        - containerPort: 8081
          name: health
          protocol: TCP
        - containerPort: 8082
          name: mcp
          protocol: TCP
        securityContext:
          readOnlyRootFilesystem: true
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - "ALL"
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8081
          initialDelaySeconds: 15
          periodSeconds: 20
        readinessProbe:
          httpGet:
            path: /readyz
            port: 8081
          initialDelaySeconds: 5
          periodSeconds: 10
        resources:
          limits:
            cpu: 500m
            memory: 128Mi
          requests:
            cpu: 10m
            memory: 64Mi
      serviceAccountName: taskmole-manager
      terminationGracePeriodSeconds: 10
