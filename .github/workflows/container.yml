name: Container Image

on:
  push:
    branches:
      - main
  release:
    types:
      - published

permissions: {}

concurrency:
  group: container-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    if: github.event_name == 'push'
    name: Build and push commit image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Clone the code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Log in to GitHub Container Registry
        run: echo "$GITHUB_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build commit and main images
        run: docker build --file Containerfile --tag "$IMAGE:$GITHUB_SHA" --tag "$IMAGE:main" .

      - name: Push commit and main images
        run: |
          docker push "$IMAGE:$GITHUB_SHA"
          docker push "$IMAGE:main"

  promote:
    if: github.event_name == 'release'
    name: Promote commit image to release version
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - name: Clone the released version
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          ref: ${{ github.event.release.tag_name }}

      - name: Set image names
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
          echo "SOURCE_TAG=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          echo "VERSION_TAG=$RELEASE_TAG" >> "$GITHUB_ENV"

      - name: Log in to GitHub Container Registry
        run: echo "$GITHUB_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Promote commit image
        run: docker buildx imagetools create --tag "$IMAGE:$VERSION_TAG" "$IMAGE:$SOURCE_TAG"

      - name: Set release image in installer
        run: |
          sed -i "s|image: $IMAGE:main|image: $IMAGE:$VERSION_TAG|" dist/install.yaml

      - name: Add installer to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$VERSION_TAG" dist/install.yaml --clobber
